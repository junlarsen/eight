[package]
name = "eight-driver"
version = "0.1.0"
edition = "2021"

[[bin]]
path = "src/bin/eightc.rs"
name = "eightc"

[dependencies]
bumpalo = { workspace = true }
clap = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
ron = { workspace = true }
thiserror = { workspace = true }
nom = "7.1.3"

eight-hir = { path = "../eight-hir" }
eight-middle = { path = "../eight-middle" }
eight-mir = { path = "../eight-mir" }
eight-syntax = { path = "../eight-syntax" }
eight-diagnostics = { path = "../eight-diagnostics" }

[dev-dependencies]
eight-macros = { path = "../eight-macros", features = ["assertion-macros"] }
